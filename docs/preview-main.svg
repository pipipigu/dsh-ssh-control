    <circle cx="26" cy="8" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="44" cy="8" r="5" fill="#10b981" opacity="0.8"/>
    <text x="64" y="12" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="500">SSH Control Center · DSH Web Settings</text>
  </g>

  <!-- Header Banner -->
  <g transform="translate(24, 50)">

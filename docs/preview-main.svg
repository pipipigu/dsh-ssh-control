      <circle cx="16" cy="20" r="4" fill="#4ade80" filter="url(#glow-green)"/>
      <text x="28" y="24" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">deploy-01</text>
      <rect x="300" y="10" width="58" height="18" rx="9" fill="#334155"/>
      <text x="310" y="23" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">OpenSSH</text>

      <rect x="16" y="34" width="338" height="20" rx="4" fill="#0b0f19"/>
      <text x="24" y="48" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">pipipig@192.168.31.121:22</text>

      <rect x="16" y="58" width="220" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="100" y="72" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">状态探查</text>

      <rect x="244" y="58" width="110" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>

  <!-- Section 2: AI Cheatsheet Preview -->
  <g transform="translate(24, 360)">
    <rect width="792" height="136" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">AI 交互使用指南 (Cheatsheet)</text>

    <!-- Example 1 -->
    <rect x="16" y="36" width="760" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="52" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">1. 多机并发广播巡检 (秒级并行调度 · 聚合输出)</text>
    <text x="26" y="68" fill="#60a5fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ssh_control(action: "status", server: "raydrive-nas, db49, 43server")</text>

    <!-- Example 2 -->
    <rect x="16" y="84" width="760" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="26" y="100" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">2. 原生 SCP 管道流双向传输 (单文件 / 目录递归)</text>
    <text x="26" y="116" fill="#60a5fa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ssh_control(action: "upload", server: "raydrive-nas", localPath: "dist", remotePath: "/srv/web")</text>
  </g>

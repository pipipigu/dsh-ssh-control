    <line x1="15" y1="21" x2="21" y2="21" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

    <text x="38" y="22" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700">SSH 控制中枢 (SSH Control Center)</text>
    <text x="38" y="40" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12">OpenSSH 配置中发现 10 台主机 · 支持单机无状态直连与多机并发广播控制</text>
    
    <!-- Action Buttons -->
    <rect x="630" y="4" width="82" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="644" y="22" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500">重新扫描</text>

    <rect x="720" y="4" width="82" height="28" rx="14" fill="url(#accent-grad)"/>
    <text x="734" y="22" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">添加主机</text>
  </g>


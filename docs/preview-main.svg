      <text x="310" y="23" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">OpenSSH</text>

      <rect x="16" y="34" width="338" height="20" rx="4" fill="#0b0f19"/>
      <text x="24" y="48" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">administrator@49.234.25.207:60522 (Win)</text>


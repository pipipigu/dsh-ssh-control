      <circle cx="16" cy="20" r="4" fill="#4ade80" filter="url(#glow-green)"/>
      <text x="28" y="24" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">43server</text>

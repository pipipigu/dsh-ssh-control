      <rect x="16" y="34" width="338" height="20" rx="4" fill="#0b0f19"/>
      <text x="24" y="48" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">pipipig@v4.raydrive.cn:18122</text>

      <!-- Buttons -->
      <rect x="16" y="58" width="220" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="80" y="72" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">⚡ 状态探查 (已连通 7.5G/2.5G)</text>

      <rect x="244" y="58" width="110" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="260" y="72" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">复制标识</text>
